<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Пельмень-кликер</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F3EEFA; --surface:#FFFFFF; --ink:#2B1B3D; --muted:#6F5E85;
  --accent:#FFB627; --accent-ink:#2B1B3D; --pink:#E85D75; --line:#DCD2EC;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1D1229; --surface:#2B1B3D; --ink:#F6EFFF; --muted:#B3A2CC;
    --accent:#FFC857; --accent-ink:#1D1229; --pink:#FF7B93; --line:#44305E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1D1229; --surface:#2B1B3D; --ink:#F6EFFF; --muted:#B3A2CC;
  --accent:#FFC857; --accent-ink:#1D1229; --pink:#FF7B93; --line:#44305E;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito","Trebuchet MS",system-ui,sans-serif;
  min-height:100vh;display:flex;justify-content:center;user-select:none;-webkit-user-select:none}
main{width:100%;max-width:480px;padding:16px 16px 32px}
.top{text-align:center;padding-top:8px}
.score{font-size:56px;font-weight:900;line-height:1;margin:0;font-variant-numeric:tabular-nums}
.sub{margin:6px 0 0;color:var(--muted);font-size:15px}
.stage{position:relative;height:300px;display:flex;align-items:center;justify-content:center}
#tap{width:240px;height:240px;border-radius:50%;border:0;background:var(--accent);
  font-size:128px;line-height:1;cursor:pointer;box-shadow:0 10px 0 var(--pink);
  transition:transform .08s,box-shadow .08s;padding:0}
#tap:active,#tap.hit{transform:translateY(8px) scale(.97);box-shadow:0 2px 0 var(--pink)}
#tap:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
.pop{position:absolute;font-weight:900;font-size:26px;color:var(--pink);pointer-events:none;
  animation:up .8s ease-out forwards}
@keyframes up{to{transform:translateY(-90px);opacity:0}}
h2{font-size:18px;margin:8px 0 10px}
.list{display:grid;gap:10px}
.up{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:12px;width:100%;
  text-align:left;background:var(--surface);color:var(--ink);border:2px solid var(--line);
  border-radius:16px;padding:12px;font:inherit;cursor:pointer}
.up .ic{font-size:32px;text-align:center}
.up b{display:block;font-size:16px}
.up small{color:var(--muted);font-size:13px}
.up .cost{font-weight:800;font-size:15px;background:var(--accent);color:var(--accent-ink);
  border-radius:12px;padding:6px 10px;white-space:nowrap}
.up:disabled{opacity:.5;cursor:default}
.up:disabled .cost{background:var(--line);color:var(--muted)}
.up:not(:disabled):active{transform:scale(.98)}
.up:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.foot{display:flex;justify-content:center;margin-top:18px}
.reset{background:none;border:0;color:var(--muted);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer}
@media (prefers-reduced-motion:reduce){.pop{animation-duration:.01s}#tap{transition:none}}
</style>
</head>
<body>
<main>
  <div class="top">
    <p class="score" id="score">0</p>
    <p class="sub"><span id="cps">0</span> пельменей в секунду · <span id="cpt">1</span> за тап</p>
  </div>
  <div class="stage" id="stage">
    <button id="tap" aria-label="Лепить пельмень">🥟</button>
  </div>
  <h2>Улучшения</h2>
  <div class="list" id="list"></div>
  <div class="foot"><button class="reset" id="reset">Начать заново</button></div>
</main>
<script>
(function(){
  var KEY="pelmen-clicker-v1";
  var ITEMS=[
    {id:"pin",ic:"🪵",name:"Скалка",desc:"+1 за тап",base:15,tap:1,cps:0},
    {id:"gran",ic:"👵",name:"Бабушка",desc:"+1 в секунду",base:50,tap:0,cps:1},
    {id:"pot",ic:"🍲",name:"Мультиварка",desc:"+6 в секунду",base:350,tap:0,cps:6},
    {id:"shop",ic:"🏪",name:"Пельменная",desc:"+30 в секунду",base:2500,tap:0,cps:30},
    {id:"fact",ic:"🏭",name:"Фабрика",desc:"+180 в секунду",base:18000,tap:0,cps:180}
  ];
  var S={score:0,own:{},t:Date.now()};
  try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p&&typeof p.score==="number"){S=p;S.own=S.own||{};}}}catch(e){}
  var $=function(id){return document.getElementById(id)};
  function cost(it){return Math.floor(it.base*Math.pow(1.5,S.own[it.id]||0))}
  function perTap(){var n=1;ITEMS.forEach(function(i){n+=i.tap*(S.own[i.id]||0)});return n}
  function perSec(){var n=0;ITEMS.forEach(function(i){n+=i.cps*(S.own[i.id]||0)});return n}
  function fmt(n){n=Math.floor(n);if(n>=1e9)return (n/1e9).toFixed(2)+" млрд";if(n>=1e6)return (n/1e6).toFixed(2)+" млн";return n.toLocaleString("ru-RU")}
  function save(){try{S.t=Date.now();localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
  var list=$("list"),btns={};
  ITEMS.forEach(function(it){
    var b=document.createElement("button");b.className="up";
    b.innerHTML='<span class="ic">'+it.ic+'</span><span><b>'+it.name+' <span class="n"></span></b><small>'+it.desc+'</small></span><span class="cost"></span>';
    b.onclick=function(){var c=cost(it);if(S.score>=c){S.score-=c;S.own[it.id]=(S.own[it.id]||0)+1;render();save()}};
    list.appendChild(b);btns[it.id]=b;
  });
  function render(){
    $("score").textContent=fmt(S.score);
    $("cps").textContent=fmt(perSec());$("cpt").textContent=fmt(perTap());
    ITEMS.forEach(function(it){
      var b=btns[it.id],c=cost(it),n=S.own[it.id]||0;
      b.disabled=S.score<c;
      b.querySelector(".cost").textContent=fmt(c);
      b.querySelector(".n").textContent=n?"×"+n:"";
    });
  }
  var tap=$("tap"),stage=$("stage");
  tap.addEventListener("pointerdown",function(e){
    var v=perTap();S.score+=v;render();
    var p=document.createElement("span");p.className="pop";p.textContent="+"+fmt(v);
    var r=stage.getBoundingClientRect();
    p.style.left=(e.clientX-r.left-12)+"px";p.style.top=(e.clientY-r.top-30)+"px";
    stage.appendChild(p);setTimeout(function(){p.remove()},800);
    try{if(window.Telegram&&Telegram.WebApp&&Telegram.WebApp.HapticFeedback)Telegram.WebApp.HapticFeedback.impactOccurred("light")}catch(x){}
  });
  tap.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();tap.classList.add("hit");S.score+=perTap();render();setTimeout(function(){tap.classList.remove("hit")},80)}});
  // доход офлайн (до 2 часов)
  var off=Math.min((Date.now()-(S.t||Date.now()))/1000,7200)*perSec();
  if(off>=1){S.score+=off}
  var last=Date.now();
  setInterval(function(){var now=Date.now(),d=(now-last)/1000;last=now;var g=perSec()*d;if(g>0){S.score+=g;render()}},250);
  setInterval(save,3000);
  document.addEventListener("visibilitychange",function(){if(document.hidden)save()});
  $("reset").onclick=function(){if(confirm("Сбросить весь прогресс?")){S={score:0,own:{},t:Date.now()};save();render()}};
  render();
})();
</script>
</body>
</html>
